[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgai-research"
version = "0.3.0.dev0"
description = "Research compiler for architecture-aware FPGA neural-network HLS and bounded source contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
keywords = ["FPGA", "HLS", "compiler", "neural-network acceleration", "intermediate representation", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/umutcanaltin/fpgai_compiler"
Documentation = "https://github.com/umutcanaltin/fpgai_compiler/blob/main/docs/README.md"
Issues = "https://github.com/umutcanaltin/fpgai_compiler/issues"

[project.optional-dependencies]
onnx = ["onnx>=1.14", "numpy>=1.24"]
rl = ["torch>=2.0", "gymnasium>=1.0,<2"]
test = ["pytest>=7", "numpy>=1.24"]
test-rl = ["pytest>=7", "torch>=2.0", "gymnasium>=1.0,<2"]
reference = ["onnx>=1.14", "onnxruntime>=1.16"]
comparison = ["hls4ml[onnx]==1.3.0", "onnx>=1.14"]

[project.scripts]
fpgai-research = "fpgai_research.cli:main"
fpgai-research-tools = "fpgai_research.toolchains.workflow:main"
fpgai-run = "fpgai_research.toolchains.onboarding:main"
fpgai-audit-weights = "fpgai_research.toolchains.weights_audit:main"
fpgai-board = "fpgai_research.toolchains.board.cli:main"
fpgai-pynq-run = "fpgai_research.toolchains.board.pynq_runtime:main"
fpgai-board-reference = "fpgai_research.toolchains.board.reference:main"
fpgai-board-ddr-audit = "fpgai_research.toolchains.board.ps_audit:main"
fpgai-rl-hardware-space = "rl_environment.hardware_space:main"
fpgai-diagnose = "fpgai_research.toolchains.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
