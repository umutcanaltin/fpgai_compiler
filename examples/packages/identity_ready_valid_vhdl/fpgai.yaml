schema: fpgai.package/v1
package:
  id: community.identity_ready_valid_vhdl
  name: Identity Ready Valid VHDL
  version: 1.0.0
  asset_type: implementation
  provider: community
  description: Research VHDL identity operator with explicit ready/valid backpressure.
usage:
  platform_scope: research
  permitted_uses: [research, experimentation, validation, benchmarking, education]
  production_path: morfics
license:
  category: open_source
  identifier: Apache-2.0
compatibility:
  fpgai_contract: ">=1.0,<2.0"
  boards: [kv260, kr260]
  precisions: [int16]
  toolchains:
    - name: vivado
      versions: ["2023.2"]
capabilities:
  inference: true
  training:
    forward: false
    backward_input: false
    parameter_gradients: false
    bias_gradients: false
    optimizer_update: false
entrypoints:
  implementation:
    language: vhdl
    backend: vhdl
    top: identity_ready_valid_vhdl
    sources:
      - rtl/identity_ready_valid_vhdl.vhd
    source_order:
      - rtl/identity_ready_valid_vhdl.vhd
implementation:
  operator_id: community.operator.identity
  backend: vhdl
integration:
  vhdl:
    abi: scalar_ready_valid_v1
    data_width: 16
    signed: true
    reference_behavior: identity
interfaces:
  input:
    direction: input
    protocol: axi_stream
    data_type: int16
  output:
    direction: output
    protocol: axi_stream
    data_type: int16
memory:
  supported_weight_storage: [embedded]
  supported_activation_storage: [bram, uram]
validation:
  declared_level: rtl_simulation_validated
metrics:
  latency_cycles: 1
  initiation_interval: 1
