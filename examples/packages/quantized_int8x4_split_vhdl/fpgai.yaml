schema: fpgai.package/v1
package:
  id: community.quantized_int8x4_split_vhdl
  name: Quantized Int8x4 Split VHDL
  version: 1.0.0
  asset_type: implementation
  provider: community
  description: Elastic one-input/two-output packed-int8 transaction split for explicit residual branches.
usage:
  platform_scope: research
  permitted_uses: [research, experimentation, validation, benchmarking, education]
  production_path: morfics
license:
  category: open_source
  identifier: Apache-2.0
compatibility:
  fpgai_contract: ">=1.0,<2.0"
  boards: [kv260, kr260]
  precisions: [int8]
  toolchains:
    - name: vivado
      versions: ["2023.2"]
capabilities:
  inference: true
  training:
    forward: true
    backward_input: false
    parameter_gradients: false
    bias_gradients: false
    optimizer_update: false
entrypoints:
  implementation:
    language: vhdl
    backend: vhdl
    top: quantized_int8x4_split_vhdl
    sources: [rtl/quantized_int8x4_split_vhdl.vhd]
    source_order: [rtl/quantized_int8x4_split_vhdl.vhd]
implementation:
  operator_id: community.operator.split
  backend: vhdl
integration:
  vhdl:
    abi: tensor_ports_ready_valid_v1
    data_width: 32
    signed: false
    handshake_policy: grouped_transaction
    inputs:
      - name: input
        data: input_data
    outputs:
      - name: main
        data: main_data
      - name: skip
        data: skip_data
interfaces:
  input:
    direction: input
    protocol: axi_stream
    data_type: packed_int8x4
  main:
    direction: output
    protocol: axi_stream
    data_type: packed_int8x4
  skip:
    direction: output
    protocol: axi_stream
    data_type: packed_int8x4
validation:
  declared_level: rtl_simulation_validated
metrics:
  latency_cycles: 1
  initiation_interval: 1
