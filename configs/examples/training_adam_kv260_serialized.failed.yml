version: 1
project:
  name: training_adam_kv260_serialized
  out_dir: build/examples/training/training_adam_kv260_serialized
  clean: true
pipeline:
  mode: training_on_device
  outputs:
    top_kernel_name: deeplearn
operators:
  supported:
  - Dense
  - Conv
  - MaxPool
  - AvgPool
  - Add
  - Relu
  - LeakyRelu
  - Sigmoid
  - Softmax
  - BatchNormalization
  - Flatten
  - Reshape
  defaults:
    activation_insert:
      kind: none
      alpha: 0.1
      except_last: true
model:
  format: onnx
  path: models/suite/mlp_mnist.onnx
targets:
  platform:
    board: kv260
    part: xck26-sfvc784-2LV-c
    clocks:
    - name: pl_clk0
      target_mhz: 200
training:
  optimizer:
    type: adam
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
    bias_correction: true
    implementation:
      arithmetic: shared
      update_parallelism: 1
  loss:
    type: cross_entropy
  batch:
    size: 1
    epochs: 2
  storage:
    gradients: uram
    optimizer_state: uram
optimization:
  parallel:
    policy: manual
    pe: 1
    simd: 1
    unroll_factor: 1
    partition_factor: 1
  pipeline:
    ii: 1
memory:
  weight_storage: uram
  activation_storage: bram
  gradient_storage: uram
  optimizer_state_storage: uram
numerics:
  defaults:
    activation:
      type: ap_fixed
      total_bits: 24
      int_bits: 12
    weight:
      type: ap_fixed
      total_bits: 20
      int_bits: 8
    bias:
      type: ap_fixed
      total_bits: 32
      int_bits: 16
    accum:
      type: ap_fixed
      total_bits: 40
      int_bits: 20
  training:
    grad:
      type: ap_fixed
      total_bits: 32
      int_bits: 16
    grad_accum:
      type: ap_fixed
      total_bits: 40
      int_bits: 20
    optimizer_state:
      type: ap_fixed
      total_bits: 32
      int_bits: 16
backends:
  hls:
    enabled: true
    vitis:
      enabled: true
      mode: csim
      exe: vitis_hls
  host_cpp:
    enabled: true
build:
  stages:
    cpp: true
    hls_project: true
    hls_synthesis: true
    reports: true
    runtime_package: true
toolchain:
  vitis_hls:
    enabled: true
    root: /tools/Xilinx/Vitis_HLS/2023.2
    install_dir: /tools/Xilinx/Vitis_HLS/2023.2
    settings64: /tools/Xilinx/Vitis_HLS/2023.2/settings64.sh
  vivado:
    enabled: true
