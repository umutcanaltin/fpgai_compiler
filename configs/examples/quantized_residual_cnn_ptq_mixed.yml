project:
  name: quantized_residual_cnn_ptq
  out_dir: build/quantized_residual_cnn_ptq_partitioned

model:
  format: onnx
  path: models/quantized_residual_cnn.onnx

targets:
  hls:
    control_protocol: ap_ctrl_none
  mixed_backend:
    final_relu_backend: vhdl
  platform:
    part: xck26-sfvc784-2LV-c
    clocks:
      - target_mhz: 200

numerics:
  defaults:
    activation: {type: ap_int, bits: 8}
    weight: {type: ap_int, bits: 8}
    bias: {type: ap_int, bits: 32}
    accum: {type: ap_int, bits: 32}
  quantization:
    mode: ptq
    weights:
      bits: 8
      scheme: symmetric
      granularity: per_channel
      signed: true
      axis: 0
      rounding: nearest
      saturation: saturate
    activations:
      bits: 8
      scheme: symmetric
      granularity: per_tensor
      signed: true
      rounding: nearest
      saturation: saturate
    accumulators:
      bits: 32
    calibration:
      method: min_max
      samples: 16
      percentile: 99.9
