version: 1
project:
  name: ir_training_trace
  out_dir: build/examples/ir_training_trace
  clean: true
  reproducibility:
    emit_manifest: true
pipeline:
  mode: training_on_device
  outputs:
    top_kernel_name: deeplearn
model:
  format: onnx
  path: models/mlp.onnx
targets:
  platform:
    board: kv260
    part: xck26-sfvc784-2LV-c
    clocks:
    - name: pl_clk0
      target_mhz: 200
operators:
  supported:
  - Dense
  - MatMul
  - Add
  - Relu
  - LeakyRelu
  - Sigmoid
  - Softmax
  - Flatten
  - Reshape
  defaults:
    activation_insert:
      kind: none
      alpha: 0.1
      except_last: true
weights:
  mode: import_export
memory:
  weight_storage: bram
  activation_storage: bram
  gradient_storage: uram
  optimizer_state_storage: bram
architecture:
  network:
    execution:
      mode: sequential
    pipeline:
      ii: 2
    parallelism:
      pe: 2
      simd: 2
    partitioning:
      factor: 2
      mode: cyclic
  defaults:
    buffering:
      storage: bram
training:
  optimizer:
    type: adam
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
  loss:
    type: mse
  batch:
    size: 2
    epochs: 1
  accumulation:
    steps: 2
    mode: native
  cache:
    store_forward_activations: true
    store_pre_activations: true
    store_pool_indices: true
    gradient_checkpointing: false
    store_step_snapshots: true
  estimator:
    enabled: true
    include_forward: true
    include_backward_input: true
    include_backward_params: true
    include_update: true
    include_buffers: true
runtime:
  sequence:
  - run_training
  - export_weights
data_movement:
  weights:
    import:
      interface: m_axi
      transport: ps_runtime
      policy: full
    export:
      interface: m_axi
      transport: ps_runtime
      policy: full
  inputs:
    interface: m_axi
    transport: ps_runtime
    policy: full
  outputs:
    interface: m_axi
    transport: ps_runtime
    policy: full
  gradients:
    interface: m_axi
    transport: ps_runtime
    policy: full
analysis:
  quantization_report:
    enabled: false
  design_space:
    enabled: false
  precision_sweep:
    enabled: false
build:
  stages:
    cpp: true
    testbench: true
    hls_project: false
    hls_synthesis: false
    vivado_project: false
    vivado_implementation: false
    bitstream: false
    runtime_package: true
    reports: true
toolchain:
  vitis_hls:
    enabled: false
  vivado:
    enabled: false
