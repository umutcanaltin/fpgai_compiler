version: 1
project:
  out_dir: build/mixed_external_relu_scale_bias_sigmoid_synth
  clean: true
model:
  path: models/mixed_external_relu_scale_bias_sigmoid.onnx
pipeline:
  mode: inference
  outputs:
    top_kernel_name: deeplearn
operators:
  supported: [Relu, ScaleBias, Sigmoid]
numerics:
  kind: fixed
  defaults:
    activation: {type: ap_fixed, total_bits: 16, int_bits: 6}
targets:
  platform:
    board: kv260
    part: xck26-sfvc784-2LV-c
    clocks:
      - name: pl_clk0
        target_mhz: 200
build:
  stages:
    cpp: true
    hls_project: true
    hls_synthesis: true
    reports: true
    runtime_package: false
ecosystem:
  enabled: true
  project_root: .
  package_directories: [examples/packages]
  strict_discovery: true
  operator_packages:
    enable: [community.scale_bias_operator]
  trust:
    community.scale_bias_operator: approved_for_reference
  validation:
    enabled: true
    input_values: [-2.0, -0.5, 0.5, 2.0]
    atol: 2.0e-3
    rtol: 2.0e-3
    run_vitis_csim: true
implementations:
  enable: [community.scale_bias_hls]
  operators:
    community.operator.scale_bias:
      preferred: [community.scale_bias_hls]
      allow_fallback: false
