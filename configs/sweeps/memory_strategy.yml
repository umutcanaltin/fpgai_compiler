name: memory_strategy
command_template: python main.py benchmark --config {config_path}
materialize_configs:
  enabled: true
  directory: configs
  strip_unknown_top_level_sections: true
  canonicalize_policy: true
  strip_top_level_sections:
    - notes
  compiler_policy_names: true

# Experiment-only memory ablation.  Each point changes one concrete weight-memory
# mechanism while keeping the maintained CNN graph and numerical precision
# fixed.  This is experiment methodology, not a compiler sweep feature.
defaults:
  base_config_path: configs/suite/cnn_mnist.yml
  config_path: configs/suite/cnn_mnist.yml
  model_path: models/suite/cnn_mnist.onnx
  board: kv260

design_points:
  - name: memory_bram_static
    memory_strategy: on_chip

  - name: memory_bram_runtime_preload
    memory_strategy: runtime_preload

  - name: memory_uram_static
    memory_strategy: uram_first

  - name: memory_external_ddr_tiled
    memory_strategy: external_ddr
